name: Build and Push on Dev

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "VALUES=values-prod.yaml" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
            echo "VALUES=values-dev.yaml" >> $GITHUB_ENV
          fi

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: docker/Dockerfile
          push: true
          tags: 980218/my-app:${{ github.sha }}

### Cannot work remotely, as on local pc          
      - name: Setup kubectl
        if: false
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        if: false
        uses: azure/setup-helm@v5

      - name: Deploy with Helm (disabled - local cluster)
        if: false
        run: |
          helm upgrade --install my-app ./helm/my-app -f ./helm/my-app/${VALUES} --set image.tag=${{ github.sha }}  