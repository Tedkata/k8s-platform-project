image:
  repository: 980218/my-app
  tag: dev

replicaCount: 1

redis:
  enabled: true

postgresql:
  enabled: true
  auth:
    username: myuser
    password: mysecretpassword
    database: mydb

service:
  port: 3000

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: my-app.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70